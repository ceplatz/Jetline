name: Deploy to Firebase Hosting

# Automatic deploys are switched off (site taken offline). To publish again, run this workflow
# manually from the Actions tab, or restore the push trigger below.
on:
  workflow_dispatch:
# on:
#   push:
#     branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: jetline-training
